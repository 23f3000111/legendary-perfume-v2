name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # This job publishes the static preview to GitHub Pages. It carries
          # no Stripe key, so the checkout shows its "not connected to a
          # payment account" notice rather than taking money from a preview,
          # and no order data can reach it. The live shop is the Vercel
          # deployment, which holds the keys and serves the /api functions.
          #
          # The canonical URL still points at the real domain, so the preview
          # cannot compete with production in an index.
          SITE_URL: https://legendary.com.my
          VITE_SITE_URL: https://legendary.com.my

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
