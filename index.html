<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      The tab icon. Client note, "amend distorted logo on tab": it used to be
      the wordmark, a 352×52 strip, and a tab slot is square, so the browser
      squashed it. The client then asked the tab to carry what the concierge
      launcher carries, so these are that same white bottle on the house gold,
      composited square by scripts/prepare-assets.py, unstretched at any size.

      Revision 9: the crown that briefly stood in between the two was still
      showing beside the site in Google's results. The files were never the
      problem: they have carried the bottle since revision 7, and /favicon.ico
      serves it today. Google caches a favicon against its URL, and it had not
      fetched ours again.

      So the PNG icons are published under names Google has never seen, which
      it has to fetch rather than serve from its own copy, and they are listed
      first. 192 is a multiple of the 48px Google asks for. The .ico keeps its
      name and comes last: a browser requests /favicon.ico whether or not the
      page mentions it, so that URL has to stay where it is.

      Google refreshes this when it next crawls the home page, which can take
      days. Requesting indexing for the home page in Search Console is what
      brings it forward; there is nothing further the site itself can do.
    -->
    <link rel="icon" type="image/png" href="/icon-192.png" sizes="192x192" />
    <link rel="icon" type="image/png" href="/icon-512.png" sizes="512x512" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1C1815" />
    <!-- The house palette is a fixed light one: ivory, sand and antique gold.
         Without this a phone in dark mode invents its own dark version of the
         site, which on iOS Safari turns the porcelain bands muddy and drops the
         contrast out of the gold. Declaring the scheme tells the browser the
         design is deliberate and to leave it alone. -->
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="Legendary — A Scented Memory of Malaysia. A heritage perfume house crafting fragrances inspired by Malaysia's landscapes, culture, and soul."
    />
    <title>Legendary · A Scented Memory of Malaysia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Cormorant Garamond + Jost carry the house.
      Noto Serif is the client's specified face for the headline figures.
      Source Serif 4 stands in for "Minion Variable Concept", which is an Adobe
      licence the site cannot host; the CSS names Minion first, so it takes over
      automatically on any machine where the real family is installed.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Jost:ital,wght@0,300..600;1,300..500&family=Noto+Serif:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
