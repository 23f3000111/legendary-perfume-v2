<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Client note, "amend distorted logo on tab": the icon used to be the
         wordmark, a 352×52 strip, and a browser tab is a square. Squashing one
         into the other is what looked broken. These are the client's own
         Logo-Icon crown on the house ink, composited square by
         scripts/prepare-assets.py, so nothing is stretched at any size. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon-512.png" sizes="512x512" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1C1815" />
    <!-- The house palette is a fixed light one: ivory, sand and antique gold.
         Without this a phone in dark mode invents its own dark version of the
         site, which on iOS Safari turns the porcelain bands muddy and drops the
         contrast out of the gold. Declaring the scheme tells the browser the
         design is deliberate and to leave it alone. -->
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="Legendary — A Scented Memory of Malaysia. A heritage perfume house crafting fragrances inspired by Malaysia's landscapes, culture, and soul."
    />
    <title>Legendary · A Scented Memory of Malaysia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Cormorant Garamond + Jost carry the house.
      Noto Serif is the client's specified face for the headline figures.
      Source Serif 4 stands in for "Minion Variable Concept", which is an Adobe
      licence the site cannot host; the CSS names Minion first, so it takes over
      automatically on any machine where the real family is installed.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Jost:ital,wght@0,300..600;1,300..500&family=Noto+Serif:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
